name: Build static site

# Bouwt de website tot kant-en-klare HTML-bestanden en zet die op de branch
# "deploy". In DirectAdmin laat je Git de branch "deploy" uitchecken naar
# public_html: dan staan daar echte HTML-bestanden in plaats van broncode.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run build:static

      - name: Publish to deploy branch
        run: |
          cd dist/client
          touch .nojekyll
          git init -b deploy
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Static build ${GITHUB_SHA}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" deploy
